openapi: 3.1.0
info:
  title: HAAT POS Integration API
  version: "1.0.0"
  description: |
    Integration API for Point of Sale systems connected to HAAT.

    All requests require the `X-Api-Key` header.

    **Write endpoints** return HTTP 200 on success or when queued, and HTTP 400 on validation failure.
    Response body always includes `requestId`, `status` (`Success` | `Pending` | `Failed`), and `message`.
    If `status` is `Pending`, poll **GET Request Status**.
servers:
  - url: http://ext-integration.haat-delivery.io
    description: Staging
  - url: https://integration.internal.haat.delivery
    description: Production
tags:
  - name: Businesses
  - name: Orders
  - name: Sync

security:
  - ApiKeyAuth: []

paths:
  /api/pos/businesses:
    get:
      tags: [Businesses]
      operationId: listBusinesses
      summary: List businesses
      description: |
        Returns the list of businesses assigned to your POS integration.
        Use the `businessId` values from this response in all other endpoints.
      responses:
        "200":
          description: Businesses assigned to your API key
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Business"
              examples:
                sample:
                  value:
                    - businessId: 1021
                      businessName: My Restaurant - Main Branch
                      areaName: Tel Aviv
                    - businessId: 1022
                      businessName: My Restaurant - Second Branch
                      areaName: Haifa

  /api/pos/business/{businessId}/prepare-time:
    get:
      tags: [Orders]
      operationId: getPrepareTime
      summary: Get prepare time
      description: Returns available prepare-time options (in minutes) for your business.
      parameters:
        - $ref: "#/components/parameters/BusinessId"
        - name: orderId
          in: query
          required: false
          schema:
            type: integer
          description: If provided, returns prepare-time options relevant to that order
      responses:
        "200":
          description: Prepare-time options in minutes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
              examples:
                sample:
                  value: [10, 15, 20, 25, 30, 45, 60]

  /api/pos/business/{businessId}/sync-status/{requestId}:
    get:
      tags: [Sync]
      operationId: getRequestStatus
      summary: Get request status
      description: |
        Check the processing status of a previously submitted request.
        When a PUT returns `"Pending"`, poll this endpoint until `"Success"` or `"Failed"`.
      parameters:
        - $ref: "#/components/parameters/BusinessId"
        - name: requestId
          in: path
          required: true
          schema:
            type: string
          description: Tracking ID from the original PUT response
      responses:
        "200":
          description: Current request status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
              examples:
                sample:
                  value:
                    requestId: "6651a3f2e1b2c3d4e5f60001"
                    status: Success
                    message: null

  /api/pos/business/{businessId}/status:
    get:
      tags: [Businesses]
      operationId: getBusinessStatus
      summary: Get business status
      description: |
        Read-only. Returns the partner display status mapped for POS.

        - Response is only `{ "status": "Open" }` or `{ "status": "Closed" }`
        - Mapping: Open → Open; Busy / Close / Soon → Closed
        - Distinct from PUT Closed(`0`) / Open(`1`), which writes and returns a sync `requestId`
        - Missing business → `404`
      parameters:
        - $ref: "#/components/parameters/BusinessId"
      responses:
        "200":
          description: Current POS display status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessStatusResponse"
              examples:
                open:
                  value:
                    status: Open
                closed:
                  value:
                    status: Closed
        "404":
          description: Business not found for this API key
    put:
      tags: [Businesses]
      operationId: updateBusinessStatus
      summary: Update business status
      description: |
        Open or close your business.

        - `status` `0` = Closed
        - `status` `1` = Open

        `closeExpirationDate` and `openExpirationDate` are optional ISO 8601 future datetimes.
        When omitted, HAAT may calculate expiration from working hours (and days off) or clear it.

        Breaking change vs older docs: previously `0` = Online and `1` = Offline, and
        `closeExpirationDate` was required when closing.

        On success, `message` is typically `Branch status updated successfully`.
        Already open / already closed returns Success with `Branch is already open` /
        `Branch is already closed` (no second apply).

        To read the current POS display status (`Open` / `Closed`), use GET on this path.
      parameters:
        - $ref: "#/components/parameters/BusinessId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessStatusRequest"
            examples:
              open:
                summary: Open
                value:
                  status: 1
              close:
                summary: Close with optional expiration
                value:
                  status: 0
                  closeExpirationDate: "2026-12-31T08:00:00Z"
              openWithExpiration:
                summary: Open with optional open expiration
                value:
                  status: 1
                  openExpirationDate: "2026-12-31T22:00:00Z"
      responses:
        "200":
          description: Success or queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
              examples:
                success:
                  value:
                    requestId: "6651a3f2e1b2c3d4e5f60001"
                    status: Success
                    message: "Branch status updated successfully"
                alreadyOpen:
                  value:
                    requestId: "6651a3f2e1b2c3d4e5f60002"
                    status: Success
                    message: "Branch is already open"
        "400":
          description: Validation or apply failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
              examples:
                unsupportedStatus:
                  value:
                    requestId: "6651a3f2e1b2c3d4e5f60004"
                    status: Failed
                    message: "Error: status 2 is not supported"

  /api/pos/business/{businessId}/order-status:
    get:
      tags: [Orders]
      operationId: getOrderStatus
      summary: Get order status
      description: |
        Read-only. Returns the current order display status string.

        - No `requestId` / sync audit
        - Response: `{ "orderId", "status" }` where `status` is `New` | `Preparing` | `Ready` | `Done` | `Cancelled`
        - Different from PUT numeric `1` / `2` / `3`; the string can change over time without another PUT
      parameters:
        - $ref: "#/components/parameters/BusinessId"
        - name: orderId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
          description: HAAT order ID
      responses:
        "200":
          description: Current order display status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatusGetResponse"
              examples:
                sample:
                  value:
                    orderId: 98765
                    status: Preparing
        "404":
          description: Order not found or not on this business
    put:
      tags: [Orders]
      operationId: updateOrderStatus
      summary: Update order status
      description: |
        Update the status of an order.

        - `status` `1` = Start Prepare (requires `estimationMinutes` > 0)
        - `status` `2` = Cancel
        - `status` `3` = Done Prepare (`{ "orderId", "status": 3 }` — no `estimationMinutes`)

        Done Prepare requires a prior Start Prepare. It fails if the order is cancelled,
        already Done Prepare, not started, pending customer approval, picker-restricted, or ineligible.
        Failures return HTTP 400 with `status` `Failed` and a `message`.

        On success, `message` is like `Order {orderId} updated to {Status} successfully`.
        Response `status` is `Success`, `Pending`, or `Failed`. If `Pending`, poll GET sync-status.
      parameters:
        - $ref: "#/components/parameters/BusinessId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusRequest"
            examples:
              startPrepare:
                summary: Start prepare
                value:
                  orderId: 98765
                  status: 1
                  estimationMinutes: 20
              donePrepare:
                summary: Done prepare
                value:
                  orderId: 98765
                  status: 3
              cancel:
                summary: Cancel
                value:
                  orderId: 98765
                  status: 2
      responses:
        "200":
          description: Success or queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
              examples:
                success:
                  value:
                    requestId: "6651a3f2e1b2c3d4e5f60001"
                    status: Success
                    message: "Order 98765 updated to Preparing successfully"
        "400":
          description: Validation or business-rule failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
              examples:
                failed:
                  value:
                    requestId: "6651a3f2e1b2c3d4e5f60002"
                    status: Failed
                    message: "Order must be started before DonePrepare"

  /api/pos/business/{businessId}/working-hours:
    get:
      tags: [Businesses]
      operationId: getWorkingHours
      summary: Get working hours
      description: |
        Read-only. Returns the business's regular weekly working hours.

        - Body is `{ "days": [ ... ] }` only (no `requestId` / sync audit)
        - Only active open days; closed days omitted (`type` `1` never returned)
        - If every day is closed → `{ "days": [] }`
        - Field order on each day: `day`, `hours`, `type`
        - `type`: `0` = specific hours, `2` = open 24 hours (`hours` is `[]`)
        - `fromHour` / `toHour`: `"HH:mm"` UTC; overnight ranges allowed
        - Does not include occasion overrides, temporary special hours, or days off
      parameters:
        - $ref: "#/components/parameters/BusinessId"
      responses:
        "200":
          description: Regular weekly schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkingHoursResponse"
              examples:
                sample:
                  value:
                    days:
                      - day: 1
                        hours:
                          - fromHour: "08:00"
                            toHour: "14:00"
                          - fromHour: "17:00"
                            toHour: "23:00"
                        type: 0
                      - day: 2
                        hours:
                          - fromHour: "09:00"
                            toHour: "22:00"
                        type: 0
                      - day: 6
                        hours:
                          - fromHour: "10:00"
                            toHour: "23:00"
                        type: 0
                      - day: 7
                        hours: []
                        type: 2
                emptyWeek:
                  value:
                    days: []
        "401":
          description: Missing or invalid API key
        "403":
          description: Key not authorized for this business
    put:
      tags: [Businesses]
      operationId: updateWorkingHours
      summary: Update working hours
      description: |
        Full replacement of weekly working hours. Any day not included is treated as closed.
        Do not send `type` `1`; omit the day instead.

        - `day`: 1=Sunday … 7=Saturday
        - `type` (optional numeric enum): `0` (default) = open during `hours`,
          `1` = Closed (do not send), `2` = open 24 hours
        - `fromHour` / `toHour`: `"HH:mm"` UTC, 24-hour clock; ranges must not overlap

        To read the schedule after an update, use GET on this path.
      parameters:
        - $ref: "#/components/parameters/BusinessId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkingHoursRequest"
            examples:
              sample:
                value:
                  days:
                    - day: 1
                      hours:
                        - fromHour: "08:00"
                          toHour: "14:00"
                        - fromHour: "17:00"
                          toHour: "23:00"
                    - day: 2
                      hours:
                        - fromHour: "09:00"
                          toHour: "22:00"
                    - day: 6
                      type: 2
      responses:
        "200":
          $ref: "#/components/responses/WriteOk"
        "400":
          $ref: "#/components/responses/WriteBadRequest"

  /api/pos/business/{businessId}/availability:
    put:
      tags: [Businesses]
      operationId: updateAvailability
      summary: Update availability
      description: |
        Update menu item availability in bulk.
        `items` are your item identifiers as configured during onboarding.
      parameters:
        - $ref: "#/components/parameters/BusinessId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityRequest"
            examples:
              unavailable:
                value:
                  items: ["ITEM-001", "ITEM-002", "DEAL-010"]
                  available: false
              available:
                value:
                  items: ["ITEM-001", "ITEM-002"]
                  available: true
      responses:
        "200":
          $ref: "#/components/responses/WriteOk"
        "400":
          $ref: "#/components/responses/WriteBadRequest"

  /api/pos/business/{businessId}/menu:
    get:
      tags: [Businesses]
      operationId: getMenu
      summary: Get menu from HAAT
      description: |
        Returns the HAAT menu for a business (categories, meals, deals, allocations).

        - Partner calls HAAT (not the external POS get-menu that HAAT calls)
        - No `requestId` / sync audit / Pending
        - Classification uses Allocation (`allocationId` / `allocations`); not meal categories
        - HAAT ids only
        - Hidden/deleted rows omitted from category lists; unavailable rows stay with `available: false`
      parameters:
        - $ref: "#/components/parameters/BusinessId"
      responses:
        "200":
          description: Menu JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosMenuResponse"
              examples:
                sample:
                  value:
                    lastModified: "2026-10-28T12:00:00Z"
                    allocations:
                      - haatId: 4
                        name: Drinks
                    categories:
                      - haatId: 10
                        name:
                          en-US: Burgers
                          ar: برغر
                          he: המבורגרים
                          fr: Burgers
                        imageUrl: https://images.haat.delivery/categories/burgers.jpg
                        meals:
                          - haatId: 201
                            name:
                              en-US: Classic Burger
                              ar: برغر
                              he: המבורגר
                              fr: Burger
                            price: 32.5
                            available: true
                            imageUrl: https://images.haat.delivery/meals/burger.jpg
                            allocationId: 4
                            groups:
                              - haatId: 8
                                name:
                                  en-US: Add-ons
                                min: 0
                                max: 3
                                mealContents:
                                  - haatId: 900
                                    name:
                                      en-US: Cheese
                                    price: 3
                                    available: true
                                    imageUrl: null
                                    isDefault: true
                                    nonModifiable: false
                                    maxCount: 5
                                    allocationId: 4
                        deals:
                          - haatId: 300
                            name:
                              en-US: Combo
                            price: 49.9
                            available: false
                            imageUrl: null
                            allocationId: 4
                            mealGroups:
                              - haatId: 40
                                name:
                                  en-US: Choose a burger
                                min: 1
                                max: 1
                                meals:
                                  - haatId: 201
                                    name:
                                      en-US: Classic Burger
                                    price: 0
                                    available: true
                                    imageUrl: https://images.haat.delivery/meals/burger.jpg
                                    allocationId: 4
                                    groups: []
        "401":
          description: Missing or invalid API key
        "403":
          description: Key not authorized for this business
        "404":
          description: Business not found

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: API key provided by HAAT

  parameters:
    BusinessId:
      name: businessId
      in: path
      required: true
      schema:
        type: integer
      description: HAAT business ID from List Businesses

  responses:
    WriteOk:
      description: Success or queued for processing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WriteResponse"
          examples:
            success:
              value:
                requestId: "6651a3f2e1b2c3d4e5f60003"
                status: Success
                message: Updated successfully
            pending:
              value:
                requestId: "6651a3f2e1b2c3d4e5f60003"
                status: Pending
                message: null
    WriteBadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WriteResponse"

  schemas:
    Business:
      type: object
      required: [businessId, businessName]
      properties:
        businessId:
          type: integer
        businessName:
          type: string
        areaName:
          type: [string, "null"]

    WriteResponse:
      type: object
      required: [requestId, status]
      properties:
        requestId:
          type: string
        status:
          type: string
          enum: [Success, Pending, Failed]
        message:
          type: [string, "null"]

    BusinessStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: integer
          enum: [0, 1]
          description: "0 = Closed, 1 = Open"
        openExpirationDate:
          type: [string, "null"]
          description: |
            Optional when Open (`status` 1) only. ISO 8601 future datetime.
            Must not be sent when Closed.
        closeExpirationDate:
          type: [string, "null"]
          description: |
            Optional when Closed (`status` 0) only. ISO 8601 future datetime.
            Must not be sent when Open. If omitted on Close, HAAT may derive
            next opening time from working hours (UTC).

    BusinessStatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [Open, Closed]
          description: |
            POS display status. Mapped from HAAT: Open → Open;
            Busy / Close / Soon → Closed.

    OrderStatusRequest:
      type: object
      required: [orderId, status]
      properties:
        orderId:
          type: integer
          minimum: 1
          description: HAAT order ID
        status:
          type: integer
          enum: [1, 2, 3]
          description: "1 = Start Prepare, 2 = Cancel, 3 = Done Prepare"
        estimationMinutes:
          type: integer
          minimum: 1
          description: Required when status is 1; omit for Cancel and Done Prepare

    OrderStatusGetResponse:
      type: object
      required: [orderId, status]
      properties:
        orderId:
          type: integer
        status:
          type: string
          enum: [New, Preparing, Ready, Done, Cancelled]
          description: Current display status (not the PUT numeric 1/2/3)

    HourRange:
      type: object
      required: [fromHour, toHour]
      properties:
        fromHour:
          type: string
          example: "08:00"
        toHour:
          type: string
          example: "14:00"

    WorkingDay:
      type: object
      required: [day]
      properties:
        day:
          type: integer
          minimum: 1
          maximum: 7
          description: "1=Sunday … 7=Saturday"
        type:
          type: integer
          enum: [0, 1, 2]
          description: |
            Numeric enum (not a string). 0 = specific hours (default if omitted on PUT),
            1 = Closed (do not send on PUT; omit the day; never returned on GET),
            2 = open 24 hours (hours empty).
        hours:
          type: array
          items:
            $ref: "#/components/schemas/HourRange"

    WorkingHoursRequest:
      type: object
      required: [days]
      properties:
        days:
          type: array
          description: Full weekly replacement. Omit closed days; do not send type 1.
          items:
            $ref: "#/components/schemas/WorkingDay"

    WorkingHoursResponse:
      type: object
      required: [days]
      properties:
        days:
          type: array
          description: |
            Active open days only, ordered by day ascending. Closed days omitted.
            Empty array when every day is closed.
          items:
            $ref: "#/components/schemas/WorkingDay"

    AvailabilityRequest:
      type: object
      required: [items, available]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: string
        available:
          type: boolean

    LocalizedMenuName:
      type: object
      additionalProperties:
        type: string
      description: |
        Localized names. Keys include en-US, ar, he, fr, and any other stored language.
        If en-US is missing or blank, HAAT fills it from he, then ar, then fr, then any other non-empty value.

    PosMenuAllocation:
      type: object
      required: [haatId, name]
      properties:
        haatId:
          type: integer
        name:
          type: string
          description: Single string (not a language dictionary)

    PosMenuMealContent:
      type: object
      required: [haatId, name, price, available]
      properties:
        haatId:
          type: integer
          description: Ingredient menu-item id
        name:
          $ref: "#/components/schemas/LocalizedMenuName"
        price:
          type: number
        available:
          type: boolean
        imageUrl:
          type: [string, "null"]
        isDefault:
          type: boolean
        nonModifiable:
          type: boolean
        maxCount:
          type: integer
          description: Stored max amount, or 0 when null
        allocationId:
          type: [integer, "null"]

    PosMenuGroup:
      type: object
      required: [haatId, name, min, max, mealContents]
      properties:
        haatId:
          type: integer
        name:
          $ref: "#/components/schemas/LocalizedMenuName"
        min:
          type: integer
        max:
          type: integer
        mealContents:
          type: array
          items:
            $ref: "#/components/schemas/PosMenuMealContent"

    PosMenuMeal:
      type: object
      required: [haatId, name, price, available, groups]
      properties:
        haatId:
          type: integer
        name:
          $ref: "#/components/schemas/LocalizedMenuName"
        price:
          type: number
        available:
          type: boolean
        imageUrl:
          type: [string, "null"]
        allocationId:
          type: [integer, "null"]
        groups:
          type: array
          items:
            $ref: "#/components/schemas/PosMenuGroup"

    PosMenuDealGroup:
      type: object
      required: [haatId, name, min, max, meals]
      properties:
        haatId:
          type: integer
        name:
          $ref: "#/components/schemas/LocalizedMenuName"
        min:
          type: integer
        max:
          type: integer
        meals:
          type: array
          items:
            $ref: "#/components/schemas/PosMenuMeal"

    PosMenuDeal:
      type: object
      required: [haatId, name, price, available, mealGroups]
      properties:
        haatId:
          type: integer
        name:
          $ref: "#/components/schemas/LocalizedMenuName"
        price:
          type: number
        available:
          type: boolean
        imageUrl:
          type: [string, "null"]
        allocationId:
          type: [integer, "null"]
        mealGroups:
          type: array
          items:
            $ref: "#/components/schemas/PosMenuDealGroup"

    PosMenuCategory:
      type: object
      required: [haatId, name, meals, deals]
      properties:
        haatId:
          type: integer
        name:
          $ref: "#/components/schemas/LocalizedMenuName"
        imageUrl:
          type: [string, "null"]
        meals:
          type: array
          items:
            $ref: "#/components/schemas/PosMenuMeal"
        deals:
          type: array
          items:
            $ref: "#/components/schemas/PosMenuDeal"

    PosMenuResponse:
      type: object
      required: [allocations, categories]
      properties:
        lastModified:
          type: [string, "null"]
          format: date-time
          description: Newest menu outbox creation time; null when none
        allocations:
          type: array
          description: Lookup for allocationId; only allocations used by this menu
          items:
            $ref: "#/components/schemas/PosMenuAllocation"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/PosMenuCategory"
