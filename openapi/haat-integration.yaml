openapi: 3.1.0
info:
  title: HAAT POS Integration API
  version: "1.0.0"
  description: |
    Integration API for Point of Sale systems connected to HAAT.

    All requests require the `X-Api-Key` header.

    **Write endpoints** return HTTP 200 on success or when queued, and HTTP 400 on validation failure.
    Response body always includes `requestId`, `status` (`Success` | `Pending` | `Failed`), and `message`.
    If `status` is `Pending`, poll **GET Request Status**.
servers:
  - url: http://ext-integration.haat-delivery.io
    description: Staging
  - url: https://integration.internal.haat.delivery
    description: Production
tags:
  - name: Businesses
  - name: Orders
  - name: Sync

security:
  - ApiKeyAuth: []

paths:
  /api/pos/businesses:
    get:
      tags: [Businesses]
      operationId: listBusinesses
      summary: List businesses
      description: |
        Returns the list of businesses assigned to your POS integration.
        Use the `businessId` values from this response in all other endpoints.
      responses:
        "200":
          description: Businesses assigned to your API key
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Business"
              examples:
                sample:
                  value:
                    - businessId: 1021
                      businessName: My Restaurant - Main Branch
                      areaName: Tel Aviv
                    - businessId: 1022
                      businessName: My Restaurant - Second Branch
                      areaName: Haifa

  /api/pos/business/{businessId}/prepare-time:
    get:
      tags: [Orders]
      operationId: getPrepareTime
      summary: Get prepare time options
      description: Returns available prepare-time options (in minutes) for your business.
      parameters:
        - $ref: "#/components/parameters/BusinessId"
        - name: orderId
          in: query
          required: false
          schema:
            type: integer
          description: If provided, returns prepare-time options relevant to that order
      responses:
        "200":
          description: Prepare-time options in minutes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
              examples:
                sample:
                  value: [10, 15, 20, 25, 30, 45, 60]

  /api/pos/business/{businessId}/sync-status/{requestId}:
    get:
      tags: [Sync]
      operationId: getRequestStatus
      summary: Get request status
      description: |
        Check the processing status of a previously submitted request.
        When a PUT returns `"Pending"`, poll this endpoint until `"Success"` or `"Failed"`.
      parameters:
        - $ref: "#/components/parameters/BusinessId"
        - name: requestId
          in: path
          required: true
          schema:
            type: string
          description: Tracking ID from the original PUT response
      responses:
        "200":
          description: Current request status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
              examples:
                sample:
                  value:
                    requestId: "6651a3f2e1b2c3d4e5f60001"
                    status: Success
                    message: null

  /api/pos/business/{businessId}/status:
    get:
      tags: [Businesses]
      operationId: getBusinessStatus
      summary: Get business status
      description: |
        Read-only. Returns the partner display status mapped for POS.

        - Response is only `{ "status": "Open" }` or `{ "status": "Closed" }`
        - Mapping: Open → Open; Busy / Close / Soon → Closed
        - Distinct from PUT Online(`0`) / Offline(`1`), which writes and returns a sync `requestId`
        - Missing business → `404`
      parameters:
        - $ref: "#/components/parameters/BusinessId"
      responses:
        "200":
          description: Current POS display status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessStatusResponse"
              examples:
                open:
                  value:
                    status: Open
                closed:
                  value:
                    status: Closed
        "404":
          description: Business not found for this API key
    put:
      tags: [Businesses]
      operationId: updateBusinessStatus
      summary: Update business status
      description: |
        Open or close your business.

        - `status` `0` = Online (open)
        - `status` `1` = Offline (closed)

        When closing, `closeExpirationDate` (ISO 8601, future) is required.
        When opening, omit it or set it to null. The business reopens automatically when the expiration is reached.

        To read the current POS display status (`Open` / `Closed`), use GET on this path.
      parameters:
        - $ref: "#/components/parameters/BusinessId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessStatusRequest"
            examples:
              open:
                summary: Open
                value:
                  status: 0
              close:
                summary: Close temporarily
                value:
                  status: 1
                  closeExpirationDate: "2026-07-01T23:59:59"
      responses:
        "200":
          $ref: "#/components/responses/WriteOk"
        "400":
          $ref: "#/components/responses/WriteBadRequest"

  /api/pos/business/{businessId}/order-status:
    get:
      tags: [Orders]
      operationId: getOrderStatus
      summary: Get order status
      description: |
        Read-only. Returns the current order display status string.

        - No `requestId` / sync audit
        - Response: `{ "orderId", "status" }` where `status` is `New` | `Preparing` | `Ready` | `Done` | `Cancelled`
        - Different from PUT numeric `1` / `2` / `3`; the string can change over time without another PUT
      parameters:
        - $ref: "#/components/parameters/BusinessId"
        - name: orderId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
          description: HAAT order ID
      responses:
        "200":
          description: Current order display status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatusGetResponse"
              examples:
                sample:
                  value:
                    orderId: 98765
                    status: Preparing
        "404":
          description: Order not found or not on this business
    put:
      tags: [Orders]
      operationId: updateOrderStatus
      summary: Update order status
      description: |
        Update the status of an order.

        - `status` `1` = Start Prepare (requires `estimationMinutes` > 0)
        - `status` `2` = Cancel
        - `status` `3` = Done Prepare (`{ "orderId", "status": 3 }` — no `estimationMinutes`)

        Done Prepare requires a prior Start Prepare. It fails if the order is cancelled,
        already Done Prepare, not started, pending customer approval, picker-restricted, or ineligible.
        Failures return HTTP 400 with `status` `Failed` and a `message`.

        On success, `message` is like `Order {orderId} updated to {Status} successfully`.
        Response `status` is `Success`, `Pending`, or `Failed`. If `Pending`, poll GET sync-status.
      parameters:
        - $ref: "#/components/parameters/BusinessId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusRequest"
            examples:
              startPrepare:
                summary: Start prepare
                value:
                  orderId: 98765
                  status: 1
                  estimationMinutes: 20
              donePrepare:
                summary: Done prepare
                value:
                  orderId: 98765
                  status: 3
              cancel:
                summary: Cancel
                value:
                  orderId: 98765
                  status: 2
      responses:
        "200":
          description: Success or queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
              examples:
                success:
                  value:
                    requestId: "6651a3f2e1b2c3d4e5f60001"
                    status: Success
                    message: "Order 98765 updated to Preparing successfully"
        "400":
          description: Validation or business-rule failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
              examples:
                failed:
                  value:
                    requestId: "6651a3f2e1b2c3d4e5f60002"
                    status: Failed
                    message: "Order must be started before DonePrepare"

  /api/pos/business/{businessId}/working-hours:
    put:
      tags: [Businesses]
      operationId: updateWorkingHours
      summary: Update working hours
      description: |
        Full replacement of weekly working hours. Any day not included is treated as closed.

        - `day`: 1=Sunday … 7=Saturday
        - `type`: `0` (default) = open during `hours`, `2` = open 24 hours
        - `fromHour` / `toHour`: `"HH:mm"` UTC, 24-hour clock; ranges must not overlap
      parameters:
        - $ref: "#/components/parameters/BusinessId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkingHoursRequest"
            examples:
              sample:
                value:
                  days:
                    - day: 1
                      hours:
                        - fromHour: "08:00"
                          toHour: "14:00"
                        - fromHour: "17:00"
                          toHour: "23:00"
                    - day: 2
                      hours:
                        - fromHour: "09:00"
                          toHour: "22:00"
                    - day: 6
                      type: 2
      responses:
        "200":
          $ref: "#/components/responses/WriteOk"
        "400":
          $ref: "#/components/responses/WriteBadRequest"

  /api/pos/business/{businessId}/availability:
    put:
      tags: [Businesses]
      operationId: updateAvailability
      summary: Update availability
      description: |
        Update menu item availability in bulk.
        `items` are your item identifiers as configured during onboarding.
      parameters:
        - $ref: "#/components/parameters/BusinessId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityRequest"
            examples:
              unavailable:
                value:
                  items: ["ITEM-001", "ITEM-002", "DEAL-010"]
                  available: false
              available:
                value:
                  items: ["ITEM-001", "ITEM-002"]
                  available: true
      responses:
        "200":
          $ref: "#/components/responses/WriteOk"
        "400":
          $ref: "#/components/responses/WriteBadRequest"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: API key provided by HAAT

  parameters:
    BusinessId:
      name: businessId
      in: path
      required: true
      schema:
        type: integer
      description: HAAT business ID from List Businesses

  responses:
    WriteOk:
      description: Success or queued for processing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WriteResponse"
          examples:
            success:
              value:
                requestId: "6651a3f2e1b2c3d4e5f60003"
                status: Success
                message: Updated successfully
            pending:
              value:
                requestId: "6651a3f2e1b2c3d4e5f60003"
                status: Pending
                message: null
    WriteBadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WriteResponse"

  schemas:
    Business:
      type: object
      required: [businessId, businessName]
      properties:
        businessId:
          type: integer
        businessName:
          type: string
        areaName:
          type: [string, "null"]

    WriteResponse:
      type: object
      required: [requestId, status]
      properties:
        requestId:
          type: string
        status:
          type: string
          enum: [Success, Pending, Failed]
        message:
          type: [string, "null"]

    BusinessStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: integer
          enum: [0, 1]
          description: "0 = Online (open), 1 = Offline (closed)"
        closeExpirationDate:
          type: [string, "null"]
          description: Required when closing; ISO 8601 future datetime

    BusinessStatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [Open, Closed]
          description: |
            POS display status. Mapped from HAAT: Open → Open;
            Busy / Close / Soon → Closed.

    OrderStatusRequest:
      type: object
      required: [orderId, status]
      properties:
        orderId:
          type: integer
          minimum: 1
          description: HAAT order ID
        status:
          type: integer
          enum: [1, 2, 3]
          description: "1 = Start Prepare, 2 = Cancel, 3 = Done Prepare"
        estimationMinutes:
          type: integer
          minimum: 1
          description: Required when status is 1; omit for Cancel and Done Prepare

    OrderStatusGetResponse:
      type: object
      required: [orderId, status]
      properties:
        orderId:
          type: integer
        status:
          type: string
          enum: [New, Preparing, Ready, Done, Cancelled]
          description: Current display status (not the PUT numeric 1/2/3)

    HourRange:
      type: object
      required: [fromHour, toHour]
      properties:
        fromHour:
          type: string
          example: "08:00"
        toHour:
          type: string
          example: "14:00"

    WorkingDay:
      type: object
      required: [day]
      properties:
        day:
          type: integer
          minimum: 1
          maximum: 7
          description: "1=Sunday … 7=Saturday"
        type:
          type: integer
          enum: [0, 2]
          description: "0 = specific hours, 2 = open 24 hours"
        hours:
          type: array
          items:
            $ref: "#/components/schemas/HourRange"

    WorkingHoursRequest:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/WorkingDay"

    AvailabilityRequest:
      type: object
      required: [items, available]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: string
        available:
          type: boolean
