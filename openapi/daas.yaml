openapi: 3.1.0
info:
  title: HAAT DaaS External API
  version: "1.1.0"
  description: |
    Delivery-as-a-Service (DaaS) APIs for external partners.

    Base path: `/api/daas`

    1. Authenticate with username/password to receive a DaaS org JWT
    2. Call businesses and order endpoints with `Authorization: Bearer <token>`

    `businessId` is required unless `posBusinessId` is set (then `posBusinessId` overrides).
    When `isCashOrder` is `true`, item quantity and price are required for cash pricing.
servers:
  - url: https://external-partners.example.haat.delivery
    description: Replace with the DaaS environment URL provided during onboarding
tags:
  - name: Authentication
  - name: Businesses
  - name: Orders

paths:
  /api/daas/authentication/login:
    post:
      tags: [Authentication]
      operationId: daasLogin
      summary: Login
      description: Org DaaS username/password. No auth header required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginUserDto"
            examples:
              sample:
                value:
                  username: username
                  password: "password!@123"
      responses:
        "200":
          description: Login result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaasLoginResponse"

  /api/daas/businesses:
    get:
      tags: [Businesses]
      operationId: daasListBusinesses
      summary: List businesses
      description: DaaS org JWT. No params. Returns businesses linked to the authenticated organization.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Businesses for the operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaasBusinessesResponse"

  /api/daas/{businessId}/update-business:
    put:
      tags: [Businesses]
      operationId: daasUpdateBusiness
      summary: Update business
      description: DaaS org JWT. businessId must belong to the current org.
      security:
        - BearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
          description: Must belong to the current org
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDaaSBusinessDetailsRequest"
            examples:
              sample:
                value:
                  businessName: saja's bakery
                  addressNote: saja's bakery
                  location:
                    latitude: 32.51234568
                    longitude: 35.51234568
                  email: saja@haat.delivery
                  phoneNumber: "+972542182747"
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaasSimpleResponse"

  /api/daas/validate-order:
    post:
      tags: [Orders]
      operationId: daasValidateOrder
      summary: Validate order
      description: |
        DaaS org JWT. Same body as submit-order.
        Dry-run only; returns pickup/delivery estimates. Does not create an order.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitDaaSOrderRequest"
      responses:
        "200":
          description: Validation / estimate result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaasOrderResponse"

  /api/daas/submit-order:
    post:
      tags: [Orders]
      operationId: daasSubmitOrder
      summary: Submit order
      description: DaaS org JWT. Creates the delivery order in HAAT.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitDaaSOrderRequest"
            examples:
              sample:
                value:
                  businessId: 180
                  posBusinessId: POS-12345-ABC
                  daaSOrderId: DAAS-987654321
                  userDetails:
                    name: John Doe
                    phoneNumber: "+972544774783"
                    location:
                      latitude: 32.522
                      longitude: 35.148
                    address:
                      city: Umm El Fahem
                      street: Abu Lahem
                      buildingNumber: "123"
                      notes: Ring the bell
                  orderDetails:
                    items:
                      - id: 1
                        name: Chicken Shawarma Wrap
                        quantity: 2
                        price: 35.5
                  estimatedPickupTime: "2025-09-09T23:45:00"
                  bags: 2
                  isCashOrder: true
                  language: he
      responses:
        "200":
          description: Submit result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaasOrderResponse"
              examples:
                sample:
                  value:
                    status: success
                    message: Order was submitted successfully
                    data:
                      haatOrderId: 5887966
                      estimatedPickupTime: "09-09-2025 23:56:19"
                      estimatedDeliveryTime: "10-09-2025 00:16:19"

  /api/daas/orders/{orderId}/status:
    get:
      tags: [Orders]
      operationId: daasOrderStatus
      summary: Order status
      description: |
        DaaS org JWT.
        `data.orderDetails` is null if the order does not exist.
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
          description: Haat order id
      responses:
        "200":
          description: Status result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaasOrderStatusResponse"
              examples:
                sample:
                  value:
                    status: success
                    message: null
                    data:
                      orderDetails:
                        orderDate: "2025-09-09T23:45:00"
                        driverAssignmentTime: "2025-09-09T23:50:00"
                        pickupTime: "2025-09-10T00:05:00"
                        deliveryTime: null
                        bags: 2

  /api/daas/orders/{orderId}/cancel:
    put:
      tags: [Orders]
      operationId: daasCancelOrder
      summary: Cancel order
      description: DaaS org JWT. No body. Denied if already picked up or delivered.
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
          description: Haat order id
      responses:
        "200":
          description: Cancel result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaasSimpleResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginUserDto:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Org DaaS username
        password:
          type: string
          description: Password (BCrypt)

    DaaSBusinessLocationRequest:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          description: Business lat
        longitude:
          type: number
          format: double
          description: Business lng

    UpdateDaaSBusinessDetailsRequest:
      type: object
      required: [location, phoneNumber]
      properties:
        businessName:
          type: string
          description: Hebrew translation name (required in practice)
        addressNote:
          type: string
          description: Translation address
        location:
          $ref: "#/components/schemas/DaaSBusinessLocationRequest"
        email:
          type: string
          description: Finance email
        phoneNumber:
          type: string
          description: Must be +972 + 8–9 digits

    SubmitDaaSOrderUserDetailsLocation:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          description: 0,0 = location not shared yet
        longitude:
          type: number
          format: double
          description: 0,0 = location not shared yet

    SubmitDaaSOrderUserDetailsAddress:
      type: object
      properties:
        city:
          type: string
        street:
          type: string
        buildingNumber:
          type: string
        notes:
          type: string
          description: Fallback customer notes

    SubmitDaaSOrderUserDetails:
      type: object
      required: [phoneNumber, location, address]
      properties:
        name:
          type: string
          description: Required when creating a new user
        phoneNumber:
          type: string
          description: Lookup/create user; SMS
        location:
          $ref: "#/components/schemas/SubmitDaaSOrderUserDetailsLocation"
        address:
          $ref: "#/components/schemas/SubmitDaaSOrderUserDetailsAddress"

    SubmitDaaSCourierOrderItem:
      type: object
      properties:
        id:
          type: integer
          description: Line item id (default 0)
        name:
          type: string
        quantity:
          type: integer
          description: Required for cash pricing
        price:
          type: number
          format: double
          description: Unit price; required for cash pricing

    SubmitDaaSCourierOrderDetails:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SubmitDaaSCourierOrderItem"
          description: Required for cash pricing

    SubmitDaaSOrderRequest:
      type: object
      required: [userDetails, estimatedPickupTime]
      properties:
        businessId:
          type: integer
          description: Required unless posBusinessId is set
        posBusinessId:
          type: ["string", "null"]
          description: If set, overrides businessId
        daaSOrderId:
          type: string
          description: Partner order id (required in practice)
        userDetails:
          $ref: "#/components/schemas/SubmitDaaSOrderUserDetails"
        orderDetails:
          $ref: "#/components/schemas/SubmitDaaSCourierOrderDetails"
        estimatedPickupTime:
          type: string
          format: date-time
          description: Israel local time, converted to UTC
        bags:
          type: integer
          description: Ignored if org BagsInputRequired; <= 0 = no bags
        isCashOrder:
          type: ["boolean", "null"]
          description: true only if org cash is enabled
        customerNotes:
          type: ["string", "null"]
        totalAmount:
          type: ["number", "null"]
          format: double
          description: Cash — order price if set
        deliveryFee:
          type: ["number", "null"]
          format: double
          description: Cash — added on top of total
        language:
          type: ["string", "null"]
          description: Default Hebrew (he)

    DaasEnvelope:
      type: object
      properties:
        status:
          type: string
        message:
          type: ["string", "null"]

    DaasLoginResponse:
      allOf:
        - $ref: "#/components/schemas/DaasEnvelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string

    DaasSimpleResponse:
      allOf:
        - $ref: "#/components/schemas/DaasEnvelope"
        - type: object
          properties:
            data:
              type: ["null", object]

    DaasOrderStatusDetails:
      type: object
      properties:
        orderDate:
          type: ["string", "null"]
          format: date-time
        driverAssignmentTime:
          type: ["string", "null"]
          format: date-time
        pickupTime:
          type: ["string", "null"]
          format: date-time
        deliveryTime:
          type: ["string", "null"]
          format: date-time
        bags:
          type: number

    DaasOrderStatusResponse:
      allOf:
        - $ref: "#/components/schemas/DaasEnvelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                orderDetails:
                  description: null if the order does not exist
                  oneOf:
                    - type: "null"
                    - $ref: "#/components/schemas/DaasOrderStatusDetails"

    DaasBusinessesResponse:
      allOf:
        - $ref: "#/components/schemas/DaasEnvelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                organizationId:
                  type: integer
                businesses:
                  type: array
                  items:
                    type: object
                    properties:
                      businessId:
                        type: integer
                      businessName:
                        type: string
                      areaName:
                        type: string

    DaasOrderResponse:
      allOf:
        - $ref: "#/components/schemas/DaasEnvelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                haatOrderId:
                  type: integer
                estimatedPickupTime:
                  type: string
                estimatedDeliveryTime:
                  type: string
