openapi: 3.1.0
info:
  title: Restaurant POS External API
  version: "1.0.0"
  description: |
    APIs that a **restaurant POS** must host so HAAT can sync menus and submit orders.

    Auth options: `Authorization: Bearer <token>` or HMAC via `X-Signature`.
    Always send/accept `X-Haat-Version: 1.0`.
servers:
  - url: https://pos.example.com
    description: Replace with your POS base URL
tags:
  - name: Menu
    description: Full menu sync (categories, Meals, Deals, Groups, MealContents)
  - name: Orders
    description: Real-time order create from HAAT

security:
  - BearerAuth: []

paths:
  /api/menu:
    get:
      tags: [Menu]
      operationId: getMenu
      summary: Get menu from POS
      description: |
        REQUIRED endpoint. HAAT calls this to fetch the complete menu structure
        for synchronization.

        - Return the **full** menu as an **array of categories** (no pagination)
        - Respond quickly (target under 5 seconds)
        - Keep `PosId` values stable across calls
        - Reflect real-time `Available`
        - Provide localized `Name` dictionaries (`en-US` required; `he` and `ar` recommended)
        - Meal modifiers: `Groups` → `MealContents`; deal choices: `MealGroups` → `Meals`

        Sync frequency: initial setup, scheduled (typically daily), on-demand, and before processing orders when needed.
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: "Bearer token, e.g. `Bearer REPLACE_ME`"
          example: "Bearer REPLACE_ME"
        - name: X-Haat-Version
          in: header
          required: true
          schema:
            type: string
            example: "1.0"
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            example: application/json
      responses:
        "200":
          description: Menu successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
              examples:
                sample:
                  value:
                    - PosId: "cat-1"
                      Name:
                        en-US: Burgers
                        he: בורגרים
                      ImageUrl: https://example.com/categories/burgers.jpg
                      Meals:
                        - PosId: "meal-201"
                          Name:
                            en-US: Burger
                            he: המבורגר
                          Price: 32.5
                          Available: true
                          ImageUrl: https://example.com/burger.png
                          Groups:
                            - PosId: "group-10"
                              Name:
                                en-US: Add-ons
                              Price: 0
                              Available: true
                              ImageUrl: null
                              Min: 0
                              Max: 3
                              MealContents:
                                - PosId: "content-501"
                                  Name:
                                    en-US: Cheese
                                  Price: 3
                                  Available: true
                                  ImageUrl: null
                      Deals:
                        - PosId: "deal-100"
                          Name:
                            en-US: Combo Deal
                            he: קומבו
                          Price: 49.9
                          Available: true
                          ImageUrl: https://example.com/deal.png
                          MealGroups:
                            - PosId: "deal-group-1"
                              Name:
                                en-US: Choose a meal
                              Price: 0
                              Available: true
                              ImageUrl: null
                              Min: 1
                              Max: 1
                              Meals:
                                - PosId: "meal-201"
                                  Name:
                                    en-US: Burger
                                  Price: 0
                                  Available: true
                                  ImageUrl: null
                                  Groups: []
        "401":
          description: Invalid or missing authentication token
        "500":
          description: POS system error

  /api/orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Submit order
      description: |
        HAAT sends new customer orders to your POS in real time.
        Process the order and respond with an acknowledgment including your `posOrderId`.

        Honor `Idempotency-Key`: duplicate keys must not create duplicate orders.
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          example: "Bearer REPLACE_ME"
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
          example: 7dda287d-21de-4159-a058-e60618e9b786
        - name: X-Haat-Version
          in: header
          required: true
          schema:
            type: string
            example: "1.0"
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
            examples:
              sample:
                value:
                  orderId: 90001
                  businessId: 120
                  customer:
                    name: Abed
                    phone: "0500000000"
                    email: abed@example.com
                    address: null
                  items:
                    - id: 1001
                      quantity: 1
                      price: 30
                      finalPrice: 34
                      name: Burger
                      names:
                        en: Burger
                        ar: برغر
                        he: המבורגר
                        fr: Burger
                      variations:
                        - id: 11
                          quantity: 1
                          price: 4
                          finalPrice: 4
                          name: Cheese
                          names:
                            en: Cheese
                            ar: جبنة
                            he: גבינה
                            fr: Fromage
                          variations: null
                          isDeal: false
                      isDeal: false
                    - id: 2001
                      quantity: 1
                      price: 50
                      finalPrice: 58
                      name: Family Deal
                      names:
                        en: Family Deal
                        ar: صفقة عائلية
                        he: דיל משפחתי
                        fr: Menu familial
                      variations:
                        - id: 3001
                          quantity: 1
                          price: 5
                          finalPrice: 8
                          name: Deal Burger
                          names:
                            en: Deal Burger
                            ar: برغر الصفقة
                            he: המבורגר הדיל
                            fr: Burger menu
                          variations:
                            - id: 31
                              quantity: 1
                              price: 3
                              finalPrice: 3
                              name: Cheese
                              names:
                                en: Cheese
                                ar: جبنة
                                he: גבינה
                                fr: Fromage
                              variations: null
                              isDeal: false
                          isDeal: false
                      isDeal: true
                  payments:
                    - paymentType: credit_card
                      amount: 60
                  payRestaurant: 60
                  deliveryType: delivery
                  customerNotes: ""
                  formatCreatedDate: "2026-10-26T08:00:00.000Z"
                  formatDeliveryDate: "2026-10-26T08:30:00.000Z"
                  formatReadyDate: "2026-10-26T08:30:00.000Z"
                  deliveryEstimationTime: 15
                  restaurantDiscount: 0
                  remake: false
      responses:
        "200":
          description: Order accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
              examples:
                sample:
                  value:
                    status: success
                    message: Order accepted
                    posOrderId: ORD-78456

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer token shared with HAAT (or use HMAC via X-Signature)
    HmacSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: HMAC signature alternative to Bearer auth

  schemas:
    LocalizedString:
      type: object
      required: ["en-US"]
      properties:
        en-US:
          type: string
        he:
          type: string
        ar:
          type: string
      additionalProperties:
        type: string

    Category:
      type: object
      required: [PosId, Name, Meals, Deals]
      properties:
        PosId:
          type: string
          description: Your POS category ID
        Name:
          $ref: "#/components/schemas/LocalizedString"
        ImageUrl:
          type: [string, "null"]
          format: uri
        Meals:
          type: array
          items:
            $ref: "#/components/schemas/Meal"
        Deals:
          type: array
          items:
            $ref: "#/components/schemas/Deal"

    Meal:
      type: object
      required: [PosId, Name, Price, Available]
      properties:
        PosId:
          type: string
        Name:
          $ref: "#/components/schemas/LocalizedString"
        Price:
          type: number
          format: double
          description: Unit price with decimal precision (e.g. 32.5 not 3250)
        Available:
          type: boolean
        ImageUrl:
          type: [string, "null"]
          format: uri
        Groups:
          type: array
          description: Addon / modifier groups on this meal
          items:
            $ref: "#/components/schemas/Group"

    Deal:
      type: object
      required: [PosId, Name, Price, Available]
      properties:
        PosId:
          type: string
        Name:
          $ref: "#/components/schemas/LocalizedString"
        Price:
          type: number
          format: double
        Available:
          type: boolean
        ImageUrl:
          type: [string, "null"]
          format: uri
        MealGroups:
          type: array
          description: Choice groups inside the deal
          items:
            $ref: "#/components/schemas/MealGroup"

    Group:
      type: object
      required: [PosId, Name, Price, Available, Min, Max, MealContents]
      properties:
        PosId:
          type: string
        Name:
          $ref: "#/components/schemas/LocalizedString"
        Price:
          type: number
          format: double
          description: Group base price (often 0)
        Available:
          type: boolean
        ImageUrl:
          type: [string, "null"]
          format: uri
        Min:
          type: integer
          description: Minimum selections (0 = optional)
        Max:
          type: integer
          description: Maximum selections allowed
        MealContents:
          type: array
          items:
            $ref: "#/components/schemas/MealContent"

    MealContent:
      type: object
      required: [PosId, Name, Price, Available]
      properties:
        PosId:
          type: string
        Name:
          $ref: "#/components/schemas/LocalizedString"
        Price:
          type: number
          format: double
          description: Additional price (0 if free)
        Available:
          type: boolean
        ImageUrl:
          type: [string, "null"]
          format: uri

    MealGroup:
      type: object
      required: [PosId, Name, Price, Available, Min, Max, Meals]
      properties:
        PosId:
          type: string
        Name:
          $ref: "#/components/schemas/LocalizedString"
        Price:
          type: number
          format: double
        Available:
          type: boolean
        ImageUrl:
          type: [string, "null"]
          format: uri
        Min:
          type: integer
        Max:
          type: integer
        Meals:
          type: array
          items:
            $ref: "#/components/schemas/Meal"

    Customer:
      type: object
      required: [name, phone, email]
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          description: May be empty
        address:
          type: [string, "null"]

    ItemNames:
      type: object
      description: Localized names. Keys are en, ar, he, and fr when present.
      additionalProperties:
        type: string
      properties:
        en:
          type: string
        ar:
          type: string
        he:
          type: string
        fr:
          type: string

    Item:
      type: object
      required: [id, quantity, price, finalPrice, name, names, isDeal]
      description: |
        Same object for meals, deal meals, and variations.
        Meal line: `isDeal` false; `variations` are add-ons (`[]` if none).
        Deal line: `isDeal` true; `variations` are selected meals (`isDeal` false on nested meals).
        Addon / leaf: `variations` is null.
        Meal `finalPrice` = `price` + sum of each direct variation's `price` (quantity not multiplied).
        Deal `finalPrice` = `price` + sum of (child.`finalPrice` × child.`quantity`).
      properties:
        id:
          type: integer
          description: HAAT menu item id
        quantity:
          type: integer
        price:
          type: number
          format: double
          description: Unit / original price for a meal or deal
        finalPrice:
          type: number
          format: double
        name:
          type: string
          description: English display name
        names:
          $ref: "#/components/schemas/ItemNames"
        variations:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Item"
        isDeal:
          type: boolean
          description: true only on the deal line

    Payment:
      type: object
      required: [paymentType, amount]
      properties:
        paymentType:
          type: string
          enum: [credit_card, cash]
        amount:
          type: number
          format: double
          description: Must align with payRestaurant total across payments

    OrderRequest:
      type: object
      required:
        - orderId
        - businessId
        - customer
        - items
        - payments
        - payRestaurant
        - deliveryType
        - customerNotes
        - formatCreatedDate
        - formatDeliveryDate
        - formatReadyDate
        - deliveryEstimationTime
        - restaurantDiscount
        - remake
      properties:
        orderId:
          type: integer
          description: Unique order ID assigned by HAAT
        businessId:
          type: integer
          description: Restaurant / store id on the HAAT side
        customer:
          $ref: "#/components/schemas/Customer"
        items:
          type: array
          description: Meals and deals only
          items:
            $ref: "#/components/schemas/Item"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        payRestaurant:
          type: number
          format: double
          description: Sum of payment amounts
        deliveryType:
          type: string
          enum: [delivery, pickup, seat, unknown]
        customerNotes:
          type: string
          description: May be empty; not null
        formatCreatedDate:
          type: string
          format: date-time
          description: ISO-8601 UTC
          example: "2026-10-26T08:00:00.000Z"
        formatDeliveryDate:
          type: string
          format: date-time
          description: ISO-8601 UTC
          example: "2026-10-26T08:30:00.000Z"
        formatReadyDate:
          type: string
          format: date-time
          description: ISO-8601 UTC
          example: "2026-10-26T08:30:00.000Z"
        deliveryEstimationTime:
          type: [integer, "null"]
          description: Minutes from ready time to arrival
        restaurantDiscount:
          type: number
          format: double
        remake:
          type: boolean

    OrderResponse:
      type: object
      required: [status, message, posOrderId]
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Order accepted
        posOrderId:
          type: string
          example: ORD-78456
