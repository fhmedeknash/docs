openapi: 3.1.0
info:
  title: Restaurant POS External API
  version: "1.0.0"
  description: |
    APIs that a **restaurant POS** must host so HAAT can sync menus and submit orders.

    Auth options: `Authorization: Bearer <token>` or HMAC via `X-Signature`.
    Always send/accept `X-Haat-Version: 1.0`.
servers:
  - url: https://pos.example.com
    description: Replace with your POS base URL
tags:
  - name: Menu
    description: Full menu sync (categories, Meals, Deals, Groups, MealContents)
  - name: Orders
    description: Real-time order create from HAAT

security:
  - BearerAuth: []

paths:
  /api/menu:
    get:
      tags: [Menu]
      operationId: getMenu
      summary: Get menu from POS
      description: |
        REQUIRED endpoint. HAAT calls this to fetch the complete menu structure
        for synchronization.

        - Return the **full** menu as an **array of categories** (no pagination)
        - Respond quickly (target under 5 seconds)
        - Keep `PosId` values stable across calls
        - Reflect real-time `Available`
        - Provide localized `Name` dictionaries (`en-US` required; `he` and `ar` recommended)
        - Meal modifiers: `Groups` → `MealContents`; deal choices: `MealGroups` → `Meals`

        Sync frequency: initial setup, scheduled (typically daily), on-demand, and before processing orders when needed.
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: "Bearer token, e.g. `Bearer REPLACE_ME`"
          example: "Bearer REPLACE_ME"
        - name: X-Haat-Version
          in: header
          required: true
          schema:
            type: string
            example: "1.0"
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            example: application/json
      responses:
        "200":
          description: Menu successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
              examples:
                sample:
                  value:
                    - PosId: "cat-1"
                      Name:
                        en-US: Burgers
                        he: בורגרים
                      ImageUrl: https://example.com/categories/burgers.jpg
                      Meals:
                        - PosId: "meal-201"
                          Name:
                            en-US: Burger
                            he: המבורגר
                          Price: 32.5
                          Available: true
                          ImageUrl: https://example.com/burger.png
                          Groups:
                            - PosId: "group-10"
                              Name:
                                en-US: Add-ons
                              Price: 0
                              Available: true
                              ImageUrl: null
                              Min: 0
                              Max: 3
                              MealContents:
                                - PosId: "content-501"
                                  Name:
                                    en-US: Cheese
                                  Price: 3
                                  Available: true
                                  ImageUrl: null
                      Deals:
                        - PosId: "deal-100"
                          Name:
                            en-US: Combo Deal
                            he: קומבו
                          Price: 49.9
                          Available: true
                          ImageUrl: https://example.com/deal.png
                          MealGroups:
                            - PosId: "deal-group-1"
                              Name:
                                en-US: Choose a meal
                              Price: 0
                              Available: true
                              ImageUrl: null
                              Min: 1
                              Max: 1
                              Meals:
                                - PosId: "meal-201"
                                  Name:
                                    en-US: Burger
                                  Price: 0
                                  Available: true
                                  ImageUrl: null
                                  Groups: []
        "401":
          description: Invalid or missing authentication token
        "500":
          description: POS system error

  /api/orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create order in POS
      description: |
        HAAT sends new customer orders to your POS in real time.
        Process the order and respond with an acknowledgment including your `posOrderId`.

        Honor `Idempotency-Key`: duplicate keys must not create duplicate orders.
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          example: "Bearer REPLACE_ME"
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
          example: 7dda287d-21de-4159-a058-e60618e9b786
        - name: X-Haat-Version
          in: header
          required: true
          schema:
            type: string
            example: "1.0"
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
            examples:
              sample:
                value:
                  orderId: 87452
                  businessId: 1021
                  customer:
                    name: John Cohen
                    phone: "+972501234567"
                  items:
                    - id: "5012"
                      quantity: 2
                      price: 32.5
                      variations:
                        - id: "9001"
                          quantity: 1
                          price: 0.0
                    - id: "7840"
                      quantity: 1
                      price: 19.9
                  payments:
                    - paymentType: credit_card
                      amount: 84.9
                  payRestaurant: 84.9
                  deliveryType: delivery
                  customerNotes: Please remove onions from one burger.
                  formatCreatedDate: "2025-10-05T12:45:00Z"
                  formatDeliveryDate: "2025-10-05T13:20:00Z"
      responses:
        "200":
          description: Order accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
              examples:
                sample:
                  value:
                    status: success
                    message: Order accepted
                    posOrderId: ORD-78456

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer token shared with HAAT (or use HMAC via X-Signature)
    HmacSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: HMAC signature alternative to Bearer auth

  schemas:
    LocalizedString:
      type: object
      required: ["en-US"]
      properties:
        en-US:
          type: string
        he:
          type: string
        ar:
          type: string
      additionalProperties:
        type: string

    Category:
      type: object
      required: [PosId, Name, Meals, Deals]
      properties:
        PosId:
          type: string
          description: Your POS category ID
        Name:
          $ref: "#/components/schemas/LocalizedString"
        ImageUrl:
          type: [string, "null"]
          format: uri
        Meals:
          type: array
          items:
            $ref: "#/components/schemas/Meal"
        Deals:
          type: array
          items:
            $ref: "#/components/schemas/Deal"

    Meal:
      type: object
      required: [PosId, Name, Price, Available]
      properties:
        PosId:
          type: string
        Name:
          $ref: "#/components/schemas/LocalizedString"
        Price:
          type: number
          format: double
          description: Unit price with decimal precision (e.g. 32.5 not 3250)
        Available:
          type: boolean
        ImageUrl:
          type: [string, "null"]
          format: uri
        Groups:
          type: array
          description: Addon / modifier groups on this meal
          items:
            $ref: "#/components/schemas/Group"

    Deal:
      type: object
      required: [PosId, Name, Price, Available]
      properties:
        PosId:
          type: string
        Name:
          $ref: "#/components/schemas/LocalizedString"
        Price:
          type: number
          format: double
        Available:
          type: boolean
        ImageUrl:
          type: [string, "null"]
          format: uri
        MealGroups:
          type: array
          description: Choice groups inside the deal
          items:
            $ref: "#/components/schemas/MealGroup"

    Group:
      type: object
      required: [PosId, Name, Price, Available, Min, Max, MealContents]
      properties:
        PosId:
          type: string
        Name:
          $ref: "#/components/schemas/LocalizedString"
        Price:
          type: number
          format: double
          description: Group base price (often 0)
        Available:
          type: boolean
        ImageUrl:
          type: [string, "null"]
          format: uri
        Min:
          type: integer
          description: Minimum selections (0 = optional)
        Max:
          type: integer
          description: Maximum selections allowed
        MealContents:
          type: array
          items:
            $ref: "#/components/schemas/MealContent"

    MealContent:
      type: object
      required: [PosId, Name, Price, Available]
      properties:
        PosId:
          type: string
        Name:
          $ref: "#/components/schemas/LocalizedString"
        Price:
          type: number
          format: double
          description: Additional price (0 if free)
        Available:
          type: boolean
        ImageUrl:
          type: [string, "null"]
          format: uri

    MealGroup:
      type: object
      required: [PosId, Name, Price, Available, Min, Max, Meals]
      properties:
        PosId:
          type: string
        Name:
          $ref: "#/components/schemas/LocalizedString"
        Price:
          type: number
          format: double
        Available:
          type: boolean
        ImageUrl:
          type: [string, "null"]
          format: uri
        Min:
          type: integer
        Max:
          type: integer
        Meals:
          type: array
          items:
            $ref: "#/components/schemas/Meal"

    Customer:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
        phone:
          type: string
          description: E.164 format recommended

    Item:
      type: object
      required: [id, quantity, price]
      properties:
        id:
          type: string
          description: POS item ID
        quantity:
          type: integer
        price:
          type: number
          format: double
          description: Unit price with exact decimal precision
        variations:
          type: array
          description: Add-ons, sides, or nested sub-items
          items:
            $ref: "#/components/schemas/Item"

    Payment:
      type: object
      required: [paymentType, amount]
      properties:
        paymentType:
          type: string
          enum: [credit_card, cash]
        amount:
          type: number
          format: double
          description: Must align with payRestaurant total across payments

    OrderRequest:
      type: object
      required:
        - orderId
        - businessId
        - customer
        - items
        - payments
        - payRestaurant
        - deliveryType
        - formatCreatedDate
        - formatDeliveryDate
      properties:
        orderId:
          type: integer
          description: Unique order ID assigned by HAAT
        businessId:
          type: integer
          description: Restaurant / store id on the HAAT side
        customer:
          $ref: "#/components/schemas/Customer"
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        payRestaurant:
          type: number
          format: double
          description: Total amount payable to the restaurant
        deliveryType:
          type: string
          enum: [delivery, pickup]
        customerNotes:
          type: [string, "null"]
        formatCreatedDate:
          type: string
          format: date-time
          description: ISO-8601 UTC timestamp when the order was created
        formatDeliveryDate:
          type: string
          format: date-time
          description: Scheduled delivery or pickup time (ISO-8601 UTC)

    OrderResponse:
      type: object
      required: [status, message, posOrderId]
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Order accepted
        posOrderId:
          type: string
          example: ORD-78456
